<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(222, 26%, 8%)" />
      <stop offset="100%" stop-color="hsl(220, 24%, 12%)" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="hsl(210, 80%, 58%)" />
      <stop offset="100%" stop-color="hsl(160, 55%, 48%)" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="hsl(220, 18%, 16%)" stroke-width="0.7" />
    </pattern>
  </defs>

  <rect width="900" height="260" rx="16" fill="url(#bgGrad)" stroke="hsl(220, 18%, 22%)" stroke-width="1.5" />
  <rect width="900" height="260" rx="16" fill="url(#grid)" opacity="0.6" />

  <!-- Top Live Status Badge -->
  <g transform="translate(48, 38)">
    <rect width="236" height="28" rx="14" fill="hsl(152, 40%, 14%)" stroke="hsl(152, 50%, 36%)" stroke-width="1" />
    <circle cx="18" cy="14" r="4.5" fill="hsl(152, 65%, 52%)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="18" cy="14" r="8" fill="none" stroke="hsl(152, 65%, 52%)" stroke-width="1">
      <animate attributeName="r" values="4;11" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="18.5" fill="hsl(152, 65%, 72%)" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">
      LIVE ON CALL: 08047289156
    </text>
  </g>

  <!-- Main Title -->
  <text x="48" y="114" fill="hsl(210, 20%, 96%)" font-family="Segoe UI, -apple-system, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
    Setu Voice
  </text>
  <text x="48" y="146" fill="hsl(215, 16%, 70%)" font-family="Segoe UI, -apple-system, sans-serif" font-size="16" font-weight="400">
    Zero-app voice marketplace matching empty return trucks with agricultural cargo.
  </text>

  <!-- Accent Line -->
  <rect x="48" y="164" width="120" height="3" rx="1.5" fill="url(#accentGrad)" />

  <!-- Bottom Feature Pills -->
  <g transform="translate(48, 190)" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" font-weight="600">
    <rect x="0" y="0" width="132" height="28" rx="6" fill="hsl(222, 20%, 16%)" stroke="hsl(220, 18%, 26%)" />
    <text x="66" y="18" fill="hsl(210, 25%, 88%)" text-anchor="middle">Caller ID = Login</text>

    <rect x="144" y="0" width="134" height="28" rx="6" fill="hsl(222, 20%, 16%)" stroke="hsl(220, 18%, 26%)" />
    <text x="211" y="18" fill="hsl(210, 75%, 72%)" text-anchor="middle">Gnani Prisma v3.0</text>

    <rect x="290" y="0" width="136" height="28" rx="6" fill="hsl(222, 20%, 16%)" stroke="hsl(220, 18%, 26%)" />
    <text x="358" y="18" fill="hsl(152, 55%, 65%)" text-anchor="middle">Gnani Timbre v2.5</text>

    <rect x="438" y="0" width="136" height="28" rx="6" fill="hsl(222, 20%, 16%)" stroke="hsl(220, 18%, 26%)" />
    <text x="506" y="18" fill="hsl(38, 80%, 68%)" text-anchor="middle">Gemini 2.5 Flash</text>
  </g>

  <!-- Animated Waveform Visualization on Right -->
  <g transform="translate(650, 70)">
    <rect x="-15" y="-10" width="215" height="130" rx="12" fill="hsl(222, 22%, 11%)" stroke="hsl(220, 18%, 20%)" />
    <text x="92" y="14" fill="hsl(215, 14%, 58%)" font-family="monospace" font-size="10" text-anchor="middle" letter-spacing="1">8kHz PCM STREAM</text>

    <g transform="translate(14, 65)">
      <rect x="0" y="-12" width="7" height="24" rx="3.5" fill="hsl(210, 75%, 58%)">
        <animate attributeName="height" values="14;44;14" dur="1.1s" repeatCount="indefinite" />
        <animate attributeName="y" values="-7;-22;-7" dur="1.1s" repeatCount="indefinite" />
      </rect>
      <rect x="16" y="-22" width="7" height="44" rx="3.5" fill="hsl(210, 75%, 62%)">
        <animate attributeName="height" values="48;18;48" dur="0.9s" repeatCount="indefinite" />
        <animate attributeName="y" values="-24;-9;-24" dur="0.9s" repeatCount="indefinite" />
      </rect>
      <rect x="32" y="-16" width="7" height="32" rx="3.5" fill="hsl(195, 70%, 56%)">
        <animate attributeName="height" values="20;56;20" dur="1.3s" repeatCount="indefinite" />
        <animate attributeName="y" values="-10;-28;-10" dur="1.3s" repeatCount="indefinite" />
      </rect>
      <rect x="48" y="-26" width="7" height="52" rx="3.5" fill="hsl(180, 60%, 52%)">
        <animate attributeName="height" values="54;16;54" dur="1.0s" repeatCount="indefinite" />
        <animate attributeName="y" values="-27;-8;-27" dur="1.0s" repeatCount="indefinite" />
      </rect>
      <rect x="64" y="-18" width="7" height="36" rx="3.5" fill="hsl(165, 58%, 50%)">
        <animate attributeName="height" values="18;60;18" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="-9;-30;-9" dur="1.2s" repeatCount="indefinite" />
      </rect>
      <rect x="80" y="-28" width="7" height="56" rx="3.5" fill="hsl(152, 55%, 48%)">
        <animate attributeName="height" values="60;22;60" dur="0.85s" repeatCount="indefinite" />
        <animate attributeName="y" values="-30;-11;-30" dur="0.85s" repeatCount="indefinite" />
      </rect>
      <rect x="96" y="-20" width="7" height="40" rx="3.5" fill="hsl(165, 58%, 50%)">
        <animate attributeName="height" values="24;54;24" dur="1.15s" repeatCount="indefinite" />
        <animate attributeName="y" values="-12;-27;-12" dur="1.15s" repeatCount="indefinite" />
      </rect>
      <rect x="112" y="-14" width="7" height="28" rx="3.5" fill="hsl(180, 60%, 52%)">
        <animate attributeName="height" values="44;14;44" dur="1.05s" repeatCount="indefinite" />
        <animate attributeName="y" values="-22;-7;-22" dur="1.05s" repeatCount="indefinite" />
      </rect>
      <rect x="128" y="-24" width="7" height="48" rx="3.5" fill="hsl(195, 70%, 56%)">
        <animate attributeName="height" values="16;50;16" dur="0.95s" repeatCount="indefinite" />
        <animate attributeName="y" values="-8;-25;-8" dur="0.95s" repeatCount="indefinite" />
      </rect>
      <rect x="144" y="-12" width="7" height="24" rx="3.5" fill="hsl(210, 75%, 58%)">
        <animate attributeName="height" values="36;12;36" dur="1.25s" repeatCount="indefinite" />
        <animate attributeName="y" values="-18;-6;-18" dur="1.25s" repeatCount="indefinite" />
      </rect>
    </g>

    <text x="92" y="108" fill="hsl(152, 55%, 65%)" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
      Indic Real-Time Dialogue
    </text>
  </g>
</svg>
