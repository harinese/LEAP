<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(222, 26%, 8%)" />
      <stop offset="100%" stop-color="hsl(220, 24%, 11%)" />
    </linearGradient>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="hsl(210, 75%, 58%)" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="hsl(152, 60%, 50%)" />
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="hsl(38, 80%, 58%)" />
    </marker>
  </defs>

  <rect width="900" height="410" rx="14" fill="url(#archBg)" stroke="hsl(220, 18%, 20%)" stroke-width="1.5" />

  <!-- Header -->
  <text x="36" y="38" fill="hsl(210, 20%, 96%)" font-family="Segoe UI, -apple-system, sans-serif" font-size="16" font-weight="700">
    REAL-TIME VOICE ARCHITECTURE (BIDIRECTIONAL STREAMING)
  </text>
  <line x1="36" y1="50" x2="864" y2="50" stroke="hsl(220, 18%, 18%)" stroke-width="1" />

  <!-- Outer AI Pipeline Container -->
  <rect x="440" y="72" width="424" height="304" rx="12" fill="hsl(222, 24%, 10%)" stroke="hsl(220, 18%, 22%)" stroke-dasharray="5 4" />
  <text x="458" y="96" fill="hsl(215, 16%, 62%)" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">
    VOICE &amp; AI ORCHESTRATION PIPELINE
  </text>

  <!-- Node 1: Caller -->
  <g transform="translate(36, 118)">
    <rect width="160" height="86" rx="10" fill="hsl(222, 20%, 15%)" stroke="hsl(210, 45%, 40%)" stroke-width="1.5" />
    <text x="80" y="32" fill="hsl(210, 80%, 72%)" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CALLER (CLI AUTH)</text>
    <text x="80" y="52" fill="hsl(210, 20%, 96%)" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Driver or Farmer</text>
    <text x="80" y="70" fill="hsl(215, 16%, 68%)" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">Any Basic / Mobile Phone</text>
  </g>

  <!-- Node 2: Exotel -->
  <g transform="translate(36, 260)">
    <rect width="160" height="86" rx="10" fill="hsl(222, 20%, 15%)" stroke="hsl(220, 18%, 28%)" stroke-width="1.5" />
    <text x="80" y="32" fill="hsl(152, 65%, 65%)" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">EXOTEL TELEPHONY</text>
    <text x="80" y="52" fill="hsl(210, 20%, 96%)" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">08047289156</text>
    <text x="80" y="70" fill="hsl(215, 16%, 68%)" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">8kHz 16-bit PCM Stream</text>
  </g>

  <!-- Node 3: FastAPI Agent Server -->
  <g transform="translate(242, 186)">
    <rect width="164" height="96" rx="10" fill="hsl(222, 20%, 15%)" stroke="hsl(210, 60%, 48%)" stroke-width="1.5" />
    <text x="82" y="30" fill="hsl(210, 80%, 72%)" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">WEBSOCKET GATEWAY</text>
    <text x="82" y="52" fill="hsl(210, 20%, 96%)" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">FastAPI Server</text>
    <text x="82" y="70" fill="hsl(215, 16%, 68%)" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">Adaptive Noise &amp; VAD</text>
    <text x="82" y="84" fill="hsl(215, 16%, 68%)" font-family="monospace" font-size="10" text-anchor="middle">/exotel/ws</text>
  </g>

  <!-- Node 4: Gnani Prisma v3.0 STT -->
  <g transform="translate(464, 114)">
    <rect width="176" height="84" rx="10" fill="hsl(222, 22%, 15%)" stroke="hsl(210, 70%, 52%)" stroke-width="1.5" />
    <text x="88" y="28" fill="hsl(210, 80%, 72%)" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">SPEECH-TO-TEXT</text>
    <text x="88" y="50" fill="hsl(210, 20%, 96%)" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gnani Prisma v3.0</text>
    <text x="88" y="68" fill="hsl(215, 16%, 68%)" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">indic-auto | Cellular Noise</text>
  </g>

  <!-- Node 5: Gemini 2.5 Flash & Matching -->
  <g transform="translate(674, 186)">
    <rect width="168" height="96" rx="10" fill="hsl(222, 22%, 15%)" stroke="hsl(38, 75%, 52%)" stroke-width="1.5" />
    <text x="84" y="30" fill="hsl(38, 85%, 70%)" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">REASONING &amp; MATCH</text>
    <text x="84" y="52" fill="hsl(210, 20%, 96%)" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gemini 2.5 Flash</text>
    <text x="84" y="70" fill="hsl(215, 16%, 68%)" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">Corridor Match + Dialogue</text>
    <text x="84" y="85" fill="hsl(38, 80%, 68%)" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">Streaming Clause Output</text>
  </g>

  <!-- Node 6: Gnani Timbre v2.5 TTS -->
  <g transform="translate(464, 268)">
    <rect width="176" height="84" rx="10" fill="hsl(222, 22%, 15%)" stroke="hsl(152, 55%, 48%)" stroke-width="1.5" />
    <text x="88" y="28" fill="hsl(152, 65%, 65%)" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">TEXT-TO-SPEECH</text>
    <text x="88" y="50" fill="hsl(210, 20%, 96%)" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Gnani Timbre v2.5</text>
    <text x="88" y="68" fill="hsl(215, 16%, 68%)" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">9+ Regional Indic Voices</text>
  </g>

  <!-- Paths and Animated Data Packets -->
  <line x1="116" y1="204" x2="116" y2="256" stroke="hsl(210, 75%, 58%)" stroke-width="2" marker-end="url(#arrBlue)" />
  <circle cx="116" cy="204" r="3.5" fill="hsl(210, 85%, 70%)">
    <animate attributeName="cy" values="204;256" dur="1.2s" repeatCount="indefinite" />
  </circle>

  <path d="M 196 296 L 222 296 L 222 246 L 238 246" fill="none" stroke="hsl(210, 75%, 58%)" stroke-width="2" marker-end="url(#arrBlue)" />
  <circle r="3.5" fill="hsl(210, 85%, 70%)">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M 196 296 L 222 296 L 222 246 L 238 246" />
  </circle>

  <path d="M 406 218 L 430 218 L 430 156 L 460 156" fill="none" stroke="hsl(210, 75%, 58%)" stroke-width="2" marker-end="url(#arrBlue)" />
  <circle r="3.5" fill="hsl(210, 85%, 70%)">
    <animateMotion dur="1.5s" begin="0.3s" repeatCount="indefinite" path="M 406 218 L 430 218 L 430 156 L 460 156" />
  </circle>

  <path d="M 640 156 L 758 156 L 758 182" fill="none" stroke="hsl(38, 80%, 58%)" stroke-width="2" marker-end="url(#arrAmber)" />
  <circle r="3.5" fill="hsl(38, 85%, 70%)">
    <animateMotion dur="1.5s" begin="0.6s" repeatCount="indefinite" path="M 640 156 L 758 156 L 758 182" />
  </circle>

  <path d="M 758 282 L 758 310 L 644 310" fill="none" stroke="hsl(152, 60%, 50%)" stroke-width="2" marker-end="url(#arrGreen)" />
  <circle r="3.5" fill="hsl(152, 75%, 65%)">
    <animateMotion dur="1.5s" begin="0.9s" repeatCount="indefinite" path="M 758 282 L 758 310 L 644 310" />
  </circle>

  <path d="M 464 310 L 430 310 L 430 256 L 410 256" fill="none" stroke="hsl(152, 60%, 50%)" stroke-width="2" marker-end="url(#arrGreen)" />
  <circle r="3.5" fill="hsl(152, 75%, 65%)">
    <animateMotion dur="1.5s" begin="1.2s" repeatCount="indefinite" path="M 464 310 L 430 310 L 430 256 L 410 256" />
  </circle>

  <path d="M 242 264 L 210 264 L 210 316 L 200 316" fill="none" stroke="hsl(152, 60%, 50%)" stroke-width="2" marker-end="url(#arrGreen)" />
  <circle r="3.5" fill="hsl(152, 75%, 65%)">
    <animateMotion dur="1.5s" begin="1.4s" repeatCount="indefinite" path="M 242 264 L 210 264 L 210 316 L 200 316" />
  </circle>

  <!-- Legend -->
  <g transform="translate(36, 378)" font-family="Segoe UI, sans-serif" font-size="11">
    <circle cx="6" cy="5" r="4" fill="hsl(210, 80%, 62%)" />
    <text x="16" y="9" fill="hsl(215, 16%, 72%)">Inbound Caller Audio (8kHz PCM)</text>

    <circle cx="220" cy="5" r="4" fill="hsl(38, 80%, 60%)" />
    <text x="230" y="9" fill="hsl(215, 16%, 72%)">Transcribed Intent &amp; Corridor Match</text>

    <circle cx="460" cy="5" r="4" fill="hsl(152, 60%, 54%)" />
    <text x="470" y="9" fill="hsl(215, 16%, 72%)">Outbound Synthesized Indic Speech</text>
  </g>
</svg>
